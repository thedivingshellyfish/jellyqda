# Build & deploy the project website:
#   /            -> custom landing page (website/index.html)
#   /dev/        -> pkgdown site (API docs, articles, news)
# Screenshots from docs/screenshots/ are copied to /img/ for the landing page.
#
# One-time setup after merging: Settings -> Pages -> Source: "GitHub Actions"

name: website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown

      - name: Install package
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      # docs/ holds the offline wiki copy; pkgdown writes its site there,
      # so move the offline copy out of the way first (CI only, nothing
      # changes in the repo itself).
      - name: Move offline docs aside
        run: mv docs _docs_offline

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Assemble site (landing page at /, pkgdown under /dev)
        run: |
          mkdir -p site
          cp -r website/. site/
          mkdir -p site/img
          cp -r _docs_offline/screenshots/. site/img/
          mkdir -p site/dev
          mv docs/* site/dev/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
