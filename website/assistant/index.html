<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="jellyqda assistant: from interview type and analysis logic to a finished analysis in jellyqda, step by step.">
<title>jellyqda Assistant</title>
<style>
/* jellyqda Assistenz – Styles. Farben als Tokens; Dark/Light per data-theme (Standard: Systemeinstellung). */
:root {
  --bg: #0b1020; --bg2: #0f1629; --card: #141c33; --card2: #1a2440;
  --line: #26324f; --line2: #33426a;
  --text: #eef2ff; --text2: #b8c2dc; --muted: #8590b0;
  --accent: #8b7cf6; --accent2: #38bdf8; --good: #34d399; --warn: #fbbf24; --bad: #f87171;
  --de: #38bdf8; --in: #a78bfa; --mix: #f0abfc; --ab: #fbbf24;
  --code-bg: #0a0f1d; --code-text: #dbe3ff; --tk-fn: #82aaff; --tk-str: #a5e3a0; --tk-com: #6b7899;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --gloss: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 55%);
  --radius: 18px; --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f6fb; --bg2: #eceffa; --card: #ffffff; --card2: #f4f5fb;
  --line: #e1e5f2; --line2: #cdd3e6;
  --text: #141a2e; --text2: #3d4766; --muted: #626c88;
  --accent: #6d5ce8; --accent2: #0284c7; --good: #047857; --warn: #a16207; --bad: #dc2626;
  --de: #0284c7; --in: #7c3aed; --mix: #c026d3; --ab: #b45309;
  --code-bg: #f7f8fc; --code-text: #1f2640; --tk-fn: #1d5fd6; --tk-str: #2f7d32; --tk-com: #8a93ad;
  --shadow: 0 8px 24px rgba(20,26,46,.08);
  --gloss: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0) 60%);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  padding-bottom: calc(80px + var(--safe-b));
}
button { font: inherit; color: inherit; }
a { color: var(--accent2); }
:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
code, pre, .mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
#app { max-width: 780px; margin: 0 auto; padding: 14px 16px 24px; }
.view { animation: fadein .22s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Kopf */
.top { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
.top .logo { width: 46px; height: 46px; flex: none; filter: drop-shadow(0 6px 14px rgba(139,124,246,.45)); }
.top h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; font-weight: 800; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }
.top .grow { flex: 1; min-width: 0; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: inline-grid; place-items: center; cursor: pointer; flex: none; color: var(--text2); }
.iconbtn svg { width: 20px; height: 20px; }
.pagehead { display: flex; align-items: center; gap: 10px; margin: 2px 0 16px; }
.pagehead h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.pagehead .sub { color: var(--muted); font-size: 13px; }

/* Karten */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.panel h3 { margin: 0 0 8px; font-size: 16px; }
.panel > p:first-child { margin-top: 0; }
.hero {
  position: relative; overflow: hidden; border-radius: 22px; padding: 18px; margin-bottom: 16px;
  background: radial-gradient(120% 140% at 0% 0%, rgba(139,124,246,.38), transparent 55%),
              radial-gradient(120% 140% at 100% 100%, rgba(56,189,248,.30), transparent 50%), var(--card);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.hero::after { content: ""; position: absolute; inset: 0; background: var(--gloss); pointer-events: none; border-radius: inherit; }
.hero::before { content: ""; position: absolute; top: -60%; left: -30%; width: 40%; height: 220%; transform: rotate(20deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent); animation: sheen 7s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { 0%, 70% { left: -40%; } 100% { left: 130%; } }
.hero .row { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
.hero h3 { margin: 0 0 4px; font-size: 17px; }
.hero p { margin: 0; color: var(--text2); font-size: 13.5px; }
.hero .btnrow { position: relative; z-index: 1; }
.ring { width: 80px; height: 80px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 17px; text-align: center; line-height: 1.1; }
.ring .v small { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; position: relative; z-index: 1; }
.kpi { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
:root[data-theme="light"] .kpi { background: rgba(255,255,255,.65); }
.kpi b { display: block; font-size: 18px; }
.kpi span { font-size: 11.5px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 11px 16px; min-height: 46px;
  border: 1px solid var(--line2); background: var(--card2); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--text); position: relative; overflow: hidden; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: linear-gradient(135deg, var(--accent), #6d8cf6); border: none; color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); }
.btn.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%); pointer-events: none; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 11px; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active { transform: scale(.98); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btnrow > .btn { flex: 1 1 auto; }

.sectiontitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 2px 10px; }
.sectiontitle h3 { margin: 0; font-size: 15px; }
.sectiontitle span { color: var(--muted); font-size: 12.5px; }

/* Kacheln */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tile { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer;
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; color: var(--text); }
.tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--dc, var(--accent)); }
.tile::after { content: ""; position: absolute; inset: 0; background: var(--gloss); opacity: .5; pointer-events: none; }
.tile .h { display: flex; align-items: center; gap: 10px; }
.tile .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: color-mix(in srgb, var(--dc, var(--accent)) 20%, transparent); flex: none; }
.tile b { font-size: 15px; display: block; line-height: 1.25; }
.tile small { color: var(--muted); font-size: 12px; }
.tile p { margin: 0; color: var(--text2); font-size: 12.8px; line-height: 1.45; }
.tile .done { position: absolute; top: 12px; right: 12px; color: var(--good); width: 20px; height: 20px; }
.tile .done svg { width: 20px; height: 20px; }

/* Listen */
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; background: none; color: var(--text); }
.li:last-child { border-bottom: 0; }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; font-size: 14px; font-weight: 650; line-height: 1.35; }
.li .t small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.li .chev, .li > svg { color: var(--muted); width: 18px; height: 18px; flex: none; }
.num { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; background: var(--card2); border: 1px solid var(--line); flex: none; }
.num.ok { background: var(--good); color: #04261a; border-color: var(--good); }

/* Chips & Badges */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--text); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip svg { width: 15px; height: 15px; }
.tag { display: inline-block; font-size: 11px; font-weight: 750; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.tag.de { color: var(--de); background: color-mix(in srgb, var(--de) 15%, transparent); }
.tag.in { color: var(--in); background: color-mix(in srgb, var(--in) 15%, transparent); }
.tag.mix { color: var(--mix); background: color-mix(in srgb, var(--mix) 15%, transparent); }
.tag.ab { color: var(--ab); background: color-mix(in srgb, var(--ab) 15%, transparent); }
.tag.n { color: var(--text2); background: var(--card2); border-color: var(--line); }
.fit { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.fit::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.fit.g { color: var(--good); background: color-mix(in srgb, var(--good) 15%, transparent); }
.fit.o { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.fit.b { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.fit.r { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }

/* Kompass */
.stepper { display: flex; gap: 4px; margin: 0 0 14px; }
.stepper button { flex: 1; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--muted); font-size: 10.5px; font-weight: 700; min-width: 0; }
.stepper button i { display: block; height: 6px; border-radius: 999px; background: var(--line); margin-bottom: 5px; transition: background .3s; }
.stepper button.done i { background: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.stepper button.on i { background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }
.stepper button.on { color: var(--text); }
.stepper button span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q { font-size: clamp(19px, 5vw, 23px); font-weight: 800; line-height: 1.3; letter-spacing: -.01em; margin: 0 0 4px; }
.qsub { color: var(--text2); margin: 0 0 14px; font-size: 14px; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.choice { text-align: left; border: 1.5px solid var(--line2); background: var(--card); border-radius: 16px; padding: 13px 14px; cursor: pointer; color: var(--text);
  display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; transition: border-color .2s, box-shadow .2s, transform .1s; }
.choice::after { content: ""; position: absolute; inset: 0; background: var(--gloss); opacity: .45; pointer-events: none; }
.choice .ct { display: flex; align-items: flex-start; gap: 8px; }
.choice .ct b { flex: 1; font-size: 14.5px; line-height: 1.3; }
.choice .em { font-size: 20px; line-height: 1; }
.choice small { color: var(--text2); font-size: 12.5px; line-height: 1.4; }
.choice .fits { display: flex; gap: 6px; flex-wrap: wrap; }
.choice.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent), 0 8px 24px color-mix(in srgb, var(--accent) 22%, transparent);
  background: color-mix(in srgb, var(--accent) 9%, var(--card)); }
.choice.dim { opacity: .62; }
.choice:active { transform: scale(.99); }
.detail { margin-top: 14px; animation: fadein .25s ease; }
.detail h4 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.detail h4:first-child { margin-top: 0; }
.wnav { display: flex; gap: 10px; margin-top: 16px; position: sticky; bottom: calc(76px + var(--safe-b)); z-index: 5; padding: 10px 0 0;
  background: linear-gradient(180deg, transparent, var(--bg) 35%); }
.wnav .btn { flex: 1; }

/* Faden (wie der Codebaum in jellyqda) */
.faden { list-style: none; margin: 0; padding: 0; }
.faden li { position: relative; padding: 0 0 14px 30px; }
.faden li:last-child { padding-bottom: 0; }
.faden li::before { content: ""; position: absolute; left: 8px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--nc, var(--accent)); box-shadow: 0 0 10px color-mix(in srgb, var(--nc, var(--accent)) 70%, transparent); }
.faden li::after { content: ""; position: absolute; left: 13.5px; top: 19px; bottom: -3px; width: 3px; border-radius: 2px; background: var(--lc, var(--line)); }
.faden li:last-child::after { display: none; }
.faden li.empty::before { background: var(--card2); border: 2px dashed var(--line2); box-shadow: none; }
.faden .fl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.faden .fv { font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.faden .fw { font-size: 12.5px; color: var(--text2); margin-top: 2px; }
.gauge { display: flex; align-items: center; gap: 14px; }
.gauge .meter { flex: 1; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--bad), var(--warn), var(--good)); position: relative; }
.gauge .meter i { position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: var(--card); border: 3px solid var(--text); transform: translate(-50%, -50%); box-shadow: var(--shadow); transition: left .5s; }

/* Inhalte */
.md { font-size: 15px; }
.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 10px; padding-left: 22px; }
.md li { margin: 4px 0; }
.md code { background: var(--card2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 6px; font-size: .88em; color: var(--tk-fn); word-break: break-word; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tblwrap { overflow-x: auto; margin: 6px 0 4px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
.tbl th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.box { border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: 14px; border: 1px solid; display: flex; gap: 10px; }
.box > span:first-child { font-size: 18px; line-height: 1.2; flex: none; }
.box b { display: block; margin-bottom: 2px; }
.box.tip { background: color-mix(in srgb, var(--good) 10%, var(--card)); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.box.warn { background: color-mix(in srgb, var(--warn) 10%, var(--card)); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.box.jq { background: color-mix(in srgb, var(--accent) 10%, var(--card)); border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); }
.steps { counter-reset: st; list-style: none; padding: 0; margin: 6px 0; }
.steps li { counter-increment: st; position: relative; padding: 0 0 12px 38px; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center;
  font-size: 12px; font-weight: 800; background: color-mix(in srgb, var(--accent) 20%, var(--card2)); color: var(--accent); }
.steps li::after { content: ""; position: absolute; left: 12px; top: 28px; bottom: 2px; width: 2px; background: var(--line); }
.steps li:last-child::after { display: none; }
.steps li b { display: block; }
.steps li small { color: var(--text2); font-size: 13px; display: block; }
.timeline { display: flex; gap: 0; overflow-x: auto; padding: 4px 0 8px; }
.timeline div { flex: 1 0 120px; position: relative; padding: 18px 8px 0 0; font-size: 12.5px; color: var(--text2); }
.timeline div::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 3px; background: var(--line2); }
.timeline div::after { content: ""; position: absolute; top: 0; left: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); }
.timeline div b { display: block; color: var(--text); font-size: 13px; }

/* Code */
.codebox { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--code-bg); }
.codebar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.codebar .lang { font-weight: 800; letter-spacing: .05em; text-transform: uppercase; flex: 1; }
.codebar button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 3px 8px; font-size: 11.5px; cursor: pointer; color: var(--text2); display: inline-flex; gap: 4px; align-items: center; }
.codebar button svg { width: 13px; height: 13px; }
.codebox pre { margin: 0; padding: 10px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; color: var(--code-text); white-space: pre; }
.codebox pre.prose { white-space: pre-wrap; font-family: inherit; font-size: 14px; line-height: 1.6; }
.c-com { color: var(--tk-com); font-style: italic; }
.c-str { color: var(--tk-str); }
.c-fn { color: var(--tk-fn); }

/* Screenshots */
.shot { margin: 12px 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card2); }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { font-size: 12px; color: var(--muted); padding: 7px 12px; border-top: 1px solid var(--line); }
.shot.noimg img { display: none; }
.shot.noimg::before { content: "🖼️  " attr(data-missing); display: block; padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13px; }

/* Visualisierungen */
.vis { background: var(--card2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 12px 0; }
.vis svg { display: block; width: 100%; max-width: 480px; margin: 0 auto; height: auto; }
.vis .cap { font-size: 12.5px; color: var(--text2); margin-top: 8px; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; flex-wrap: wrap; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
.svgt { fill: var(--text); font: 700 12px system-ui, sans-serif; }
.svgs { fill: var(--muted); font: 600 10px system-ui, sans-serif; }
.svgbox { fill: var(--card); stroke: var(--line2); stroke-width: 1.5; }
.sprow { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 10px; align-items: center; padding: 7px 4px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; color: var(--text); border-radius: 10px; }
.sprow:hover, .sprow.on { background: var(--card); }
.sprow b { font-size: 13px; font-weight: 650; line-height: 1.25; }
.sprow .track { height: 10px; border-radius: 999px; position: relative; background: linear-gradient(90deg, color-mix(in srgb, var(--in) 55%, transparent), color-mix(in srgb, var(--de) 55%, transparent)); }
.sprow .track i { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--card); border: 3px solid var(--text); transform: translate(-50%, -50%); }
.sprow .track s { position: absolute; top: 50%; height: 16px; transform: translateY(-50%); border-radius: 999px; border: 2px dashed color-mix(in srgb, var(--text) 45%, transparent); }
.spaxis { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 10px; font-size: 11px; color: var(--muted); font-weight: 700; padding: 0 4px 4px; }
.spaxis div { display: flex; justify-content: space-between; }
.tree { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.tree > li { margin-bottom: 8px; }
.tree .cf { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 9px; background: var(--fc); color: #10131f; font-weight: 700; }
.tree ul { list-style: none; margin: 4px 0 0 14px; padding: 0 0 0 14px; border-left: 3px solid var(--fc); }
.tree ul li { position: relative; margin: 5px 0; }
.tree ul li::before { content: ""; position: absolute; left: -14px; top: 50%; width: 11px; height: 3px; background: var(--fc); }
.tree ul li span { display: inline-block; padding: 3px 9px; border-radius: 8px; border: 2px solid var(--fc); font-weight: 600; }
.tree .n { font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 700; }
.mtable td.new { animation: pop .4s ease; }
@keyframes pop { from { background: color-mix(in srgb, var(--accent) 30%, transparent); } to { background: transparent; } }
.mcat { display: inline-block; padding: 3px 9px; border-radius: 8px; font-weight: 700; font-size: 12px; color: #10131f; }
.transcript { font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; overflow-x: auto; }
.transcript div { white-space: pre-wrap; }
.transcript .ts { color: var(--accent2); font-weight: 700; }
.transcript .sp { color: var(--accent); font-weight: 800; }
.transcript .ps { background: color-mix(in srgb, var(--warn) 25%, transparent); border-radius: 4px; padding: 0 2px; }
.transcript .pa { color: var(--muted); }

/* Quiz */
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line2); background: var(--card2); border-radius: 13px; padding: 11px 13px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--text); }
.opt .k { width: 24px; height: 24px; border-radius: 8px; background: var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card2)); }
.opt.right .k { background: var(--good); color: #04261a; }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card2)); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt:disabled { cursor: default; }
.verdict { margin-top: 10px; font-size: 14px; }
.verdict b.ok { color: var(--good); } .verdict b.no { color: var(--bad); }

/* Checklisten, Suche, Einstellungen */
.ck { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.ck:last-child { border-bottom: 0; }
.ck input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 1px 0 0; }
.ck span { font-size: 14px; }
.ck.on span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.bar { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
.searchbox { position: relative; margin-bottom: 14px; }
.searchbox input { width: 100%; border-radius: 14px; border: 1px solid var(--line2); background: var(--card); color: var(--text); padding: 13px 14px 13px 42px; font: inherit; outline: none; }
.searchbox input:focus { border-color: var(--accent); }
.searchbox svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--muted); }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; }
.gl { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.gl:last-child { border-bottom: 0; }
.gl b { display: block; font-size: 14.5px; margin-bottom: 2px; }
.gl div { font-size: 13.8px; color: var(--text2); }
.lit { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13.8px; }
.lit:last-child { border-bottom: 0; }
.lit .chips { margin-top: 6px; gap: 5px; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow .t { flex: 1; min-width: 0; }
.setrow .t b { display: block; font-size: 14px; }
.setrow .t small { color: var(--muted); font-size: 12px; }

/* Tabbar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 6px 6px calc(6px + var(--safe-b)); }
.tabbar .in { display: flex; width: 100%; max-width: 580px; }
.tab { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 650; border-radius: 12px; text-decoration: none; }
.tab svg { width: 23px; height: 23px; }
.tab.on { color: var(--accent); }
.tab.on svg { filter: drop-shadow(0 2px 8px color-mix(in srgb, var(--accent) 60%, transparent)); }
.toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 13.5px; transition: all .25s; pointer-events: none; z-index: 50; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .mt { margin-top: 12px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 26px; }
.foot a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* Hinweis lokale Speicherung */
.notice { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: color-mix(in srgb, var(--accent2) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent2) 35%, var(--line));
  border-radius: 16px; padding: 12px 14px; margin: 0 0 16px; font-size: 13.5px; }
.notice .t { flex: 1 1 220px; }
.notice .t b { display: block; }
.notice .btn { min-height: 34px; }
.langbtn { font-weight: 800; font-size: 13px; text-decoration: none; }
.printhead, .printfoot { display: none; }

/* Druck / PDF: A4, immer helle Farben, nur der Inhalt */
@page { size: A4; margin: 15mm 14mm 16mm; }
@media print {
  :root, :root[data-theme] {
    --bg: #fff; --bg2: #fff; --card: #fff; --card2: #f6f7fb; --line: #d9deea; --line2: #c5cbdc;
    --text: #111827; --text2: #374151; --muted: #6b7280; --accent: #5b4bd6; --accent2: #0369a1;
    --good: #047857; --warn: #a16207; --bad: #b91c1c; --de: #0369a1; --in: #6d28d9; --mix: #a21caf; --ab: #a16207;
    --code-bg: #f6f7fb; --code-text: #111827; --tk-fn: #1d4ed8; --tk-str: #166534; --tk-com: #6b7280; --shadow: none; --gloss: none;
    color-scheme: light;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; animation: none !important; transition: none !important; }
  html, body { background: #fff !important; color: var(--text); font-size: 10.5pt; line-height: 1.45; }
  body { padding: 0 !important; }
  #app { max-width: none; padding: 0; }
  .tabbar, .wnav, .noprint, .toast, .iconbtn, .stepper, .notice, .pagehead, .foot { display: none !important; }
  .printhead { display: flex !important; align-items: center; gap: 10px; border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 12px; }
  .printhead .logo { width: 30px; height: 30px; }
  .printhead b { font-size: 15pt; display: block; }
  .printhead span { font-size: 9pt; color: var(--muted); }
  .printfoot { display: block !important; margin-top: 10px; font-size: 8.5pt; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
  .hero { background: #fff !important; border: 1.5px solid var(--line2); padding: 12px 14px; margin-bottom: 10px; }
  .hero::before, .hero::after, .tile::after, .choice::after { display: none !important; }
  .ring { width: 64px; height: 64px; }
  .panel { padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; }
  .panel h3 { font-size: 12pt; }
  .panel { break-inside: auto; }
  .panel h3 { break-after: avoid; }
  .hero, .steps li, .faden li, .box { break-inside: avoid; }
  .steps li { padding-bottom: 8px; }
  .codebox { break-inside: avoid; border-radius: 8px; }
  .codebar button { display: none; }
  .codebox pre { white-space: pre-wrap; word-break: break-word; overflow: visible; font-size: 8.5pt; padding: 6px 10px; }
  .codebox pre.prose { font-size: 10pt; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>

<div class="md"><p><b>Transcript format</b> from which jellyqda builds segments by speaker turn:</p></div>
${vis("transkript")}
${box("tip", "💡", "Fix transcription rules", "Simple or detailed transcript? Smooth out dialect? Note pauses? Fix the rules in advance (e.g. after Dresing & Pehl) and state them in the methods section. Reconstructive methods need more detail than a content analysis.")}
${box("jq", "🪼", "Why jellyqda helps here", "Fully offline: no cloud, no uploads, the app only runs on your computer. A project is one file; backups go outside the project folder. Interview data don’t belong in Git – the bundled <code>.gitignore</code> excludes them.")}`,
    quiz: [
      { q: "What needs especially thorough pseudonymisation in expert interviews?", o: ["Only the name", "Name, organisation, position and recognisable anecdotes", "Nothing, experts speak publicly", "Only the timestamps"], a: 1, ex: "In small fields, the position alone often identifies a person." }
    ] }
];

function PRWHY(sel, p) {
  const out = [];
  if (sel.lg) {
    const v = PR[p].lg[sel.lg], n = LG[sel.lg].name.toLowerCase();
    out.push(v === 2 ? "Fits your " + n + " logic." : v === 1 ? "Can be applied in a " + n + " way, but that isn’t the core of the method." : "Works differently from your chosen logic (" + LG[sel.lg].name + ").");
  }
  if (sel.iv) {
    const iv = IV[sel.iv];
    out.push(iv.good.includes(p) ? "Often used with the " + iv.name.toLowerCase() + "." : iv.ok.includes(p) ? "Possible with the " + iv.name.toLowerCase() + " – justify the choice in your methods section." : "Rather unusual for the " + iv.name.toLowerCase() + ".");
  }
  return out.join(" ");
}

function PLAN(sel) {
  const st = ST[sel.st], L = [];
  L.push({ t: "Create the project & record prior knowledge", d: "Before you code: a project memo “My prior knowledge & assumptions”. It is the basis for reflected subjectivity.", r: 'library(jellyqda)\nqda_open("my-thesis.jellyqda")\nqda_memo_add("Prior knowledge: …", title = "My prior knowledge")' });
  L.push({ t: "Import transcripts", d: "Segments by " + (st.segmode === "speaker" ? "speaker turn" : "paragraph") + ". Set variables (e.g. role) right away; postscripts as document memos.", r: 'qda_import(c("interview_01.docx", "interview_02.docx"), segments = "' + st.segmode + '")\nqda_source_set_var(1, "Role", "…")' });
  if (sel.lg === "de") {
    L.push({ t: "Set up the category system from theory", d: "Main categories and, if needed, values as subcodes. A residual category “Other” for the unexpected.", r: 'qda_code_add("Category A")\nqda_code_add("Value 1", parent = "Category A")\nqda_code_add("Other")' });
    L.push({ t: "Write the coding guideline", d: "Definition, anchor example and coding rule for each category (book icon).", r: 'qda_code_guide("Category A", definition = "…", rule = "…")' });
    L.push({ t: "Trial run & revision", d: "Code 10–50 % of the material, sharpen categories and rules. Justify changes in a code memo." });
    L.push({ t: "Main run", d: "Code everything. Use search-hit coding only with a review afterwards." });
  } else if (sel.lg === "in") {
    L.push({ t: "Initial work with the text", d: "Read the first interview slowly, note anything striking as a passage memo (Ctrl+M)." });
    L.push({ t: "Code openly", d: "Name things close to the text, in vivo is welcome. Don’t organise too early." });
    if (["mayring_z", "meuser", "glaeser"].includes(sel.pr)) L.push({ t: "Paraphrase & generalise", d: "Analysis → Summary (Mayring): paraphrase and generalisation per coding.", r: 'qda_coding_set_summary(1, paraphrase = "…", generalization = "…")' });
    L.push({ t: "Condense", d: "After every second or third interview: rename, move as a subcode, merge. Code memos with definitions.", r: 'qda_code_move("Code", parent = "Parent category")\nqda_code_merge("Old code", into = "New code")' });
    L.push({ t: "Cross-check with word lists", d: "Word frequencies and keyword in context reveal field terms and connections.", r: 'qda_words(n = 30)\nqda_kwic("term")' });
  } else if (sel.lg === "mix") {
    L.push({ t: "Create main categories", d: "From research question and guide – deductive. Note in the code memo: “defined in advance”.", r: 'qda_code_add("Topic from guide block 1")\nqda_code_add("Topic from guide block 2")' });
    L.push({ t: "First coding cycle", d: "Code all material roughly with the main categories (Ctrl+1…9)." });
    L.push({ t: "Build subcategories from the material", d: "Review the codings of a main category, build subcodes (in vivo, + Subcode). In the code memo: “built inductively”." });
    L.push({ t: "Coding guideline & second cycle", d: "Guideline for the final system, then recode in the coding bar.", r: 'qda_code_guide("Subcategory", definition = "…", rule = "…")\nqda_coding_recode(12, "Subcategory")' });
  } else {
    L.push({ t: "Mark sequences", d: "Use codes as bookmarks (e.g. “Narration”, “Argumentation”, “Opening passage”) – not as results." });
    L.push({ t: "Interpret in memos", d: "Each interpretation as a passage memo right at the sequence." });
    L.push({ t: "Prepare the interpretation group", d: "Print the report with margin column (A4) – numbers in the text, memos in the margin." });
  }
  if (["kuckartz_s", "flick", "kuckartz_t"].includes(sel.pr)) L.push({ t: "Case summaries", d: "Summary grid: one thematic summary per category and case.", r: 'qda_summary_set("Main category", 1, "…")' });
  L.push({ t: "Cross-case analysis", d: "Code matrix, case comparison by variables, collect quotes.", r: 'qda_matrix()\nqda_case_matrix("Role")\nqda_segments("Category A")' });
  L.push({ t: "Document", d: "Report, codebook and audit trail for appendix and methods section; backup in a second place.", r: 'qda_export("all")\nqda_export("audit")\nqda_backup()' });
  return L;
}

function METHOD(sel) {
  const iv = IV[sel.iv], st = ST[sel.st], pr = PR[sel.pr];
  const lgTxt = { de: "deductively; categories were derived in advance from [theory/literature] and recorded in a coding guideline with definitions, anchor examples and coding rules", in: "inductively; categories were developed step by step from the material and condensed regularly", mix: "deductively-inductively; main categories were derived from [the interview guide/theory], subcategories were built inductively from the material", ab: "reconstructively; the interviews were interpreted sequentially, codes served to structure the material" }[sel.lg];
  return "Data were collected in [N] interviews, conducted in the format “" + iv.name + "” (after " + iv.by + "). " +
    "The interviews were " + st.name.toLowerCase().replace(" (", ", ").replace(")", "") + " and lasted between [x] and [y] minutes. " +
    "They were recorded, transcribed following [transcription rules] and pseudonymised. " +
    "The analysis was carried out " + lgTxt + ", following " + pr.name + " (" + pr.by + "). " +
    "Coding was computer-assisted with the R package jellyqda (version 0.7.0). Coding guideline, memos and a complete audit trail of the analysis are documented in the appendix.";
}

function fitSt(sel, s) { return sel.iv ? IV[sel.iv].st[s] : null; }
function fitLg(sel, l) {
  const f = [];
  if (sel.iv) f.push(IV[sel.iv].lg[l]);
  if (sel.st) f.push(ST[sel.st].lg[l]);
  return f.length ? Math.min.apply(null, f) : null;
}
function fitPr(sel, p) {
  const f = [];
  if (sel.iv) f.push(IV[sel.iv].good.includes(p) ? 2 : IV[sel.iv].ok.includes(p) ? 1 : 0);
  if (sel.lg) f.push(PR[p].lg[sel.lg]);
  return f.length ? Math.min.apply(null, f) : null;
}
const STEPS = ["zi", "iv", "st", "lg", "pr", "plan"];
function links(sel) {
  return {
    iv: sel.zi && sel.iv ? (ZI[sel.zi].iv.includes(sel.iv) ? 2 : 1) : null,
    st: sel.iv && sel.st ? fitSt(sel, sel.st) : null,
    lg: sel.iv && sel.lg ? fitLg(sel, sel.lg) : null,
    pr: sel.pr ? fitPr(sel, sel.pr) : null
  };
}
function score(sel) {
  const v = Object.values(links(sel)).filter((x) => x != null);
  if (!v.length) return null;
  return v.reduce((a, b) => a + b, 0) / (2 * v.length) * (Math.min.apply(null, v) === 0 ? .6 : 1);
}

/* ---------- Kompass ---------- */
function vKompass() {

  if (id === "plan") return h + vPlan();
  const q = K.q[id];
  const sub = id === "iv" ? (sel.zi ? q[2] : q[1]) : id === "st" ? q[1] + "<b>" + (sel.iv ? IV[sel.iv].name : "–") + "</b>" : q[1];
  h += '<p class="q">' + q[0] + '</p><p class="qsub">' + sub + "</p>";
  let items = [];
  if (id === "zi") items = Object.keys(ZI).map((x) => [x, ZI[x], null, ""]);
  if (id === "iv") items = Object.keys(IV).map((x) => [x, IV[x], null, sel.zi && ZI[sel.zi].iv.includes(x) ? '<span class="fit r">' + UI.rec + "</span>" : ""]);
  if (id === "st") items = Object.keys(ST).map((x) => [x, ST[x], fitSt(sel, x), ""]);
  if (id === "lg") items = Object.keys(LG).map((x) => [x, LG[x], fitLg(sel, x), sel.zi && ZI[sel.zi].lg === x ? '<span class="fit r">' + UI.toGoal + "</span>" : ""]);
  if (id === "pr") items = Object.keys(PR).map((x) => [x, PR[x], fitPr(sel, x), supTag(PR[x].sup)]).sort((a, b) => (b[2] || 0) - (a[2] || 0));
  if (id === "iv" && sel.zi) items.sort((a, b) => (b[3] ? 1 : 0) - (a[3] ? 1 : 0));
  h += '<div class="choices">' + items.map((it) => {

      '<span class="ct">' + (o.em ? '<span class="em">' + o.em + "</span>" : "") + "<b>" + o.name + (o.by && id === "pr" ? ' <small class="muted" style="font-weight:600">(' + o.by + ")</small>" : "") + "</b></span>" +
      "<small>" + (o.short.length > 140 ? o.short.slice(0, 137) + "…" : o.short) + "</small>" +
      (f != null || extra ? '<span class="fits">' + fitTag(f) + extra + "</span>" : "") + "</button>";
  }).join("") + "</div>";
  if (sel[id]) h += detail(id, sel[id]);

    '<button class="btn primary" data-act="go-step" data-k="' + (k + 1) + '"' + (sel[id] ? "" : " disabled") + ">" + (k === 4 ? K.showPlan : UI.next) + " " + ICON.right + "</button></div>";

  let h = '<div class="printhead">' + LOGO + "<div><b>" + P.printTitle + "</b><span>" + P.printMade + date + "</span></div></div>";
  h += '<div class="hero"><div class="row"><div class="ring">' + ring(sc) + '<div class="v"><div>' + Math.round(sc * 100) + "%<small>" + P.stimmig + "</small></div></div></div><div><h3>" + P.title + "</h3><p>" +

    node(P.nodes[2], st.em + " " + st.name, l.lg, iv.stNote[sel.st], 2) +

  h += '<div class="panel"><h3>' + P.stepsT + pr.name + '</h3><ol class="steps">' + pr.steps.map((s) => "<li><small>" + s + "</small></li>").join("") + "</ol></div>";

    '<p class="small noprint"><a href="#/tool">' + P.allSteps + "</a></p></div>";

function progress() {
  const mods = MOD.filter((m) => S.read[m.id]).length, tour = TOUR.filter((t, i) => S.tour[i]).length;

  h += '<div class="tiles">' + MOD.map((m) => {
    const q = m.quiz.filter((x, i) => S.quiz[m.id + i] === x.a).length;
    return '<a class="tile" style="--dc:' + m.color + ';text-decoration:none" href="#/basics/' + m.id + '">' + (S.read[m.id] ? '<span class="done">' + ICON.check + "</span>" : "") +
      '<span class="h"><span class="ic">' + m.icon + "</span><span><b>" + m.title + "</b><small>" + B.quiz + " " + q + "/" + m.quiz.length + "</small></span></span><p>" + m.blurb + "</p></a>";
  }).join("") + "</div>";
  return h + foot();
}
function vModule(id) {
  const B = UI.basics, i = MOD.findIndex((m) => m.id === id), m = MOD[i];
  if (!m) return vBasics();
  let h = head(m.icon + " " + m.title, B.crumb + " · " + (i + 1) + " / " + MOD.length, "#/basics");
  h += '<div class="panel">' + m.body() + "</div>";
  h += '<div class="panel"><h3>' + B.quizT + "</h3>" + m.quiz.map((q, qi) => {
    const k = m.id + qi, ans = S.quiz[k];
    return '<div class="mt"><b>' + q.q + '</b><div class="opts">' + q.o.map((o, oi) => {
      const cls = ans == null ? "" : oi === q.a ? " right" : oi === ans ? " wrong" : "";
      return '<button class="opt' + cls + '" data-act="quiz" data-k="' + k + '" data-o="' + oi + '"' + (ans != null ? " disabled" : "") + '><span class="k">' + "ABCD"[oi] + "</span><span>" + o + "</span></button>";
    }).join("") + "</div>" + (ans != null ? '<div class="verdict"><b class="' + (ans === q.a ? "ok" : "no") + '">' + (ans === q.a ? B.right : B.wrong) + "</b>" + q.ex + "</div>" : "") + "</div>";
  }).join("") + "</div>";
  h += '<div class="btnrow">' + (i > 0 ? '<a class="btn" href="#/basics/' + MOD[i - 1].id + '">' + ICON.left + " " + UI.back + "</a>" : "") +
    '<button class="btn' + (S.read[id] ? "" : " primary") + '" data-act="read" data-k="' + id + '">' + ICON.check + (S.read[id] ? B.isRead : B.mark) + "</button>" +
    (i < MOD.length - 1 ? '<a class="btn" href="#/basics/' + MOD[i + 1].id + '">' + UI.next + " " + ICON.right + "</a>" : "") + "</div>";
  return h;
}
function vTour() {
  const T = UI.tour, n = TOUR.filter((t, i) => S.tour[i]).length;
  let h = head(T.title, T.done(n, TOUR.length));
  h += '<div class="panel" style="padding:12px 14px"><div class="bar"><i style="width:' + (100 * n / TOUR.length) + '%"></i></div></div>';
  h += '<div class="list">' + TOUR.map((t, i) => '<a class="li" style="text-decoration:none" href="#/tool/' + (i + 1) + '"><span class="num' + (S.tour[i] ? " ok" : "") + '">' + (S.tour[i] ? "✓" : i + 1) + '</span><span class="t"><b>' + t.t + '</b><small><span class="tag ' + T.tags[t.tag][0] + '">' + T.tags[t.tag][1] + "</span></small></span>" + ICON.chev + "</a>").join("") + "</div>";
  return h + '<p class="hint">' + T.more + "</p>";
}
function vTourStep(n) {
  const T = UI.tour, i = n - 1, t = TOUR[i];
  if (!t) return vTour();
  let h = head(t.t, T.step + " " + n + " / " + TOUR.length + ' · <span class="tag ' + T.tags[t.tag][0] + '">' + T.tags[t.tag][1] + "</span>", "#/tool");
  h += '<div class="panel"><div class="md"><p>' + t.txt + "</p></div>" + t.img.map((x) => shot(x[0], x[1])).join("") + (t.r ? '<div class="small muted mt">' + T.asR + "</div>" + codeBox(t.r) : "") +
    t.tips.map((x) => box("tip", "💡", T.tip, x)).join("") + "</div>";
  h += '<div class="btnrow">' + (i > 0 ? '<a class="btn" href="#/tool/' + (n - 1) + '" aria-label="' + UI.back + '">' + ICON.left + "</a>" : "") +
    '<button class="btn' + (S.tour[i] ? "" : " primary") + '" data-act="tour" data-k="' + i + '">' + ICON.check + (S.tour[i] ? T.isDone : T.doneNext) + "</button>" +
    (i < TOUR.length - 1 ? '<a class="btn" href="#/tool/' + (n + 1) + '" aria-label="' + UI.next + '">' + ICON.right + "</a>" : "") + "</div>";
  return h;
}
function vMore(sub) {
  const M = UI.more;
  sub = sub || "check";
  let h = head(M.title, M.sub);
  h += '<div class="seg" style="margin-bottom:14px">' + M.tabs.map((x) => '<a href="#/more/' + x[0] + '" style="text-decoration:none"><button class="' + (sub === x[0] ? "on" : "") + '" tabindex="-1">' + x[1] + "</button></a>").join("") + "</div>";
  if (sub === "check") {
    CHECK.forEach((c) => {
      const d = c.items.filter((x, i) => S.check[c.id + i]).length;
      h += '<div class="sectiontitle"><h3>' + c.em + " " + c.t + "</h3><span>" + d + " / " + c.items.length + '</span></div><div class="list">' +
        c.items.map((it, i) => { const k = c.id + i; return '<label class="ck' + (S.check[k] ? " on" : "") + '"><input type="checkbox" data-act="check" data-k="' + k + '"' + (S.check[k] ? " checked" : "") + "><span>" + it + "</span></label>"; }).join("") + "</div>";
    });
  }
  if (sub === "glossar") h += '<div class="searchbox">' + ICON.search + '<input id="gq" type="search" placeholder="' + M.search + '" aria-label="' + M.search + '" value="' + esc(VS.gq) + '"></div><div class="list" id="gl">' + glossList(VS.gq) + "</div>";
  if (sub === "lit") h += '<div class="list">' + Object.keys(LIT).map((k) => '<div class="lit">' + LIT[k] + "</div>").join("") + '</div><p class="hint">' + M.litHint + "</p>";
  if (sub === "set") {
    const th = S.theme || "auto";
    h += '<div class="panel"><h3>' + M.privT + '</h3><div class="md">' + M.priv + "</div>" + (CAN_STORE ? "" : box("warn", "⚠️", "", M.noStore)) + "</div>";
    h += '<div class="list"><div class="setrow"><div class="t"><b>' + M.theme + "</b><small>" + M.themeSub + '</small></div><div class="seg">' +
      M.themes.map((x) => '<button data-act="settheme" data-k="' + x[0] + '" class="' + (th === x[0] ? "on" : "") + '">' + x[1] + "</button>").join("") + "</div></div>" +
      '<div class="setrow"><div class="t"><b>' + M.wipe + "</b><small>" + M.wipeSub + '</small></div><button class="btn small" data-act="wipe">' + ICON.reset + M.wipeBtn + "</button></div></div>";
  }
  return h + foot();
}
function glossList(q) {
  const ql = q.trim().toLowerCase();
  const hl = (s) => ql ? esc(s).replace(new RegExp("(" + ql.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>") : esc(s);
  const r = GLOSS.filter((g) => !ql || (g[0] + " " + g[1]).toLowerCase().includes(ql));
  return r.length ? r.map((g) => '<div class="gl"><b>' + hl(g[0]) + "</b><div>" + hl(g[1]) + "</div></div>").join("") : '<div class="gl muted">' + UI.more.noHit + "</div>";
}

/* ---------- Router & Events ---------- */
const TABS = [["home", "#/", ICON.home], ["compass", "#/compass", ICON.compass], ["basics", "#/basics", ICON.book], ["tool", "#/tool", ICON.jelly], ["more", "#/more", ICON.more]];
function render(keepScroll) {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const r = parts[0] || "home";
  let html;
  if (r === "compass") html = vKompass();
  else if (r === "basics") html = parts[1] ? vModule(parts[1]) : vBasics();
  else if (r === "tool") html = parts[1] ? vTourStep(+parts[1]) : vTour();
  else if (r === "more") html = vMore(parts[1]);
  else html = vHome();
  const y = window.scrollY;
  document.getElementById("app").innerHTML = '<div class="view">' + html + "</div>";
  window.scrollTo(0, keepScroll ? y : 0);
  document.getElementById("tabbar").innerHTML = '<div class="in">' + TABS.map((t, i) => '<a class="tab' + (r === t[0] ? " on" : "") + '" href="' + t[1] + '">' + t[2] + "<span>" + UI.tabs[i] + "</span></a>").join("") + "</div>";
}
window.addEventListener("hashchange", () => render(false));

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, k = el.dataset.k;
  if (a === "choose") {
    S.sel[el.dataset.step] = k; save(); render(true);
    const d = document.getElementById("detail");
    if (d && window.innerWidth < 700) d.scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (a === "go-step") {
    e.preventDefault();
    if (el.disabled) return;
    S.step = Math.max(0, Math.min(5, +k)); save();
    if (location.hash !== "#/compass") location.hash = "#/compass"; else render(false);
  } else if (a === "restart") {
    S.sel = {}; S.step = 0; save(); render(false);
  } else if (a === "print") {
    window.print();
  } else if (a === "copy") {
    const txt = codeStore[+el.dataset.id], done = () => toast(UI.copied);
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); else fallbackCopy(txt, done);
  } else if (a === "quiz") {
    S.quiz[k] = +el.dataset.o; save(); render(true);
  } else if (a === "read") {
    S.read[k] = !S.read[k]; save(); render(true); if (S.read[k]) toast(UI.basics.good);
  } else if (a === "tour") {
    const i = +k, was = S.tour[i]; S.tour[i] = !was; save();
    if (!was && i < TOUR.length - 1) location.hash = "#/tool/" + (i + 2); else render(true);
  } else if (a === "theme") {
    S.theme = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"; save(); applyTheme(); render(true);
  } else if (a === "settheme") {
    S.theme = k === "auto" ? null : k; save(); applyTheme(); render(true);
  } else if (a === "notice-ok") {
    S.notice = true; save(); render(true);
  } else if (a === "wipe") {
    if (confirm(UI.more.wipeQ)) { wipe(); render(true); toast(UI.more.wiped); }
  } else if (a === "pick-iv") {
    S.sel.iv = k; S.step = 2; save();
  } else if (a.startsWith("vis-")) {
    const n = a.slice(4);
    if (n === "logik") VS.logik = k;
    if (n === "spek") VS.spek = VS.spek === k ? null : k;
    if (n === "karte") VS.karte = k;
    if (n === "may") VS.may = +k;
    if (n === "kreis") VS.kreis = +k;
    rerenderVis({ logik: "logik", spek: "spektrum", karte: "karte", may: "mayring", kreis: "kreis" }[n]);
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.act === "check") { S.check[el.dataset.k] = el.checked; save(); el.closest(".ck").classList.toggle("on", el.checked); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "gq") { VS.gq = e.target.value; document.getElementById("gl").innerHTML = glossList(VS.gq); }
});
function fallbackCopy(txt, cb) {
  const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); cb(); } catch (e) {} ta.remove();
}
if (window.matchMedia) matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (!S.theme) { applyTheme(); render(true); } });
applyTheme();
render(false);
})();
</script>
</body>
