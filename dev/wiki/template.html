<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$ · jellyqda wiki</title>
<link rel="icon" href="$assets$jellyqda-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="$assets$assets/style.css">
<link rel="stylesheet" href="$assets$assets/wiki.css">
<script>
  // same theme setting as the landing page (assets/main.js)
  (function () { try { var s = localStorage.getItem("jellyqda_landing_theme"); if (s) document.documentElement.setAttribute("data-theme", s); } catch (e) {} })();
</script>
</head>
<body class="wiki">
<header id="hdr">
  <div class="wrap nav">
    <a class="brand" href="$assets$$langdir$" aria-label="jellyqda">
      <img src="$assets$jellyqda-logo.svg" alt="" width="26" height="26"> jellyqda
    </a>
    <nav aria-label="Main">
      <a href="$wikihome$">$wikilabel$</a>
      <a href="$assets$dev/reference/">$reflabel$</a>
      <a href="https://github.com/thedivingshellyfish/jellyqda">GitHub</a>
    </nav>
    <div class="tools">
      <button class="pillbtn" id="themeToggle" type="button" aria-label="$themelabel$">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="wrap wikigrid">
  <nav class="wikiside" aria-label="$wikilabel$">
@@SIDEBAR@@
  </nav>
  <main class="wikimain">
$body$
  </main>
</div>
<footer class="wikifoot"><div class="wrap">
@@FOOTER@@
</div></footer>
<script>
  document.getElementById("themeToggle").addEventListener("click", function () {
    var r = document.documentElement, cur = r.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    r.setAttribute("data-theme", next);
    try { localStorage.setItem("jellyqda_landing_theme", next); } catch (e) {}
  });
  // mark the current page in the sidebar
  var here = location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll(".wikiside a").forEach(function (a) {
    if (a.getAttribute("href") === here || (here === "index.html" && a.getAttribute("href") === "Home.html")) a.setAttribute("aria-current", "page");
  });
</script>
</body>
</html>
